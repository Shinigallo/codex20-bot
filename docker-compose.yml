version: '3.8'

services:
  # Setup wizard (first-time only)
  setup:
    build: .
    container_name: codex20-setup
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "setup.py"]
    profiles:
      - setup

  # Main application
  codex20:
    build: .
    container_name: codex20-python
    ports:
      - "8085:8084"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - setup
    profiles:
      - app

networks:
  default:
    name: codex20-network
